# The `device_id` field on every device service accepts a device name, a UUID,
# or "all". The description is repeated per service (rather than shared) so it
# shows in the HA service UI, which renders each field in isolation.

send_image:
  name: Send image
  description: Push a specific image to a device immediately.
  fields:
    device_id:
      name: Device
      description: >-
        Device name (e.g. "Living Room"), device UUID, or "all" for every
        device. Names are case-insensitive; a UUID always wins over a name.
      required: true
      example: "Living Room"
      selector:
        text:
    image_id:
      name: Image ID
      description: SourceImage primary key.
      required: true
      example: 42
      selector:
        number:
          mode: box

wake_device:
  name: Wake device
  description: Wake a Frame TV from sleep.
  fields:
    device_id:
      name: Device
      description: >-
        Device name (e.g. "Living Room"), device UUID, or "all" for every
        device. Names are case-insensitive; a UUID always wins over a name.
      required: true
      example: "Living Room"
      selector:
        text:

sleep_device:
  name: Sleep device
  description: Put a Frame TV into Art Mode (its rest state).
  fields:
    device_id:
      name: Device
      description: >-
        Device name (e.g. "Living Room"), device UUID, or "all" for every
        device. Names are case-insensitive; a UUID always wins over a name.
      required: true
      example: "all"
      selector:
        text:

trigger_rule:
  name: Trigger rule
  description: Fire a ContentRule (alternative to per-rule button entities).
  fields:
    rule_id:
      name: Rule ID
      required: true
      example: 7
      selector:
        number:
          mode: box

poll_device:
  name: Poll device
  description: Queue an immediate health/status poll for a device.
  fields:
    device_id:
      name: Device
      description: >-
        Device name (e.g. "Living Room"), device UUID, or "all" for every
        device. Names are case-insensitive; a UUID always wins over a name.
      required: true
      example: "all"
      selector:
        text:

sync_source:
  name: Sync source
  description: Queue a sync of a ContentSource (e.g. refresh an Immich album or rescan a folder).
  fields:
    source_id:
      name: Source ID
      required: true
      example: 3
      selector:
        number:
          mode: box
